[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "directmail"
version = "0.1.0"
description = "Machine-to-machine encrypted mail over IPFS — terminal webmail for geeks"

readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "cryptography>=41.0.0",
  "textual>=0.80.0",
]
keywords = ["encryption", "ipfs", "email", "e2ee", "tui"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security :: Cryptography",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[project.scripts]
directmail = "directmail.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
directmail = ["*.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
